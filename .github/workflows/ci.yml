name: CI

on:
  push:
    branches: [restart, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install bubblewrap (Linux sandbox tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy src

      - name: Tests
        run: uv run pytest --cov=bear_agent --cov-report=term-missing

      - name: Build package
        run: uv build

      - name: Install wheel smoke
        shell: bash
        run: |
          uv venv .release-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON=.release-venv/Scripts/python.exe
            BEAR=.release-venv/Scripts/bear.exe
          else
            PYTHON=.release-venv/bin/python
            BEAR=.release-venv/bin/bear
          fi
          uv pip install --python "$PYTHON" dist/bear_agent-*.whl
          "$BEAR" --version
          "$BEAR" --help
          "$BEAR" tui --help